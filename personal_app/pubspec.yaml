name: personal_app
description: "Personal App — an all-in-one personal life management application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  csv: ^6.0.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  flutter_markdown: ^0.7.7
  fl_chart: ^0.70.2
  table_calendar: ^3.2.0
  encrypt: ^5.0.3
  crypto: ^3.0.6
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0
  local_auth: ^3.0.1
  url_launcher: ^6.3.2
  google_generative_ai: ^0.4.7
  firebase_storage: ^13.1.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#2D77BB"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - dotenv
    - assets/
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
