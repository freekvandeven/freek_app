name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Format, Analyze & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/ integration_test/

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

  integration:
    name: Integration Tests (Firebase Emulators)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - run: flutter pub get

      - name: Install Cloud Functions dependencies
        run: cd functions && npm install

      - name: Start chromedriver
        run: chromedriver --port=4444 &

      - name: Run integration tests with Firebase emulators
        run: |
          firebase emulators:exec \
            --project freek-personal-app \
            "flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/app_test.dart \
              -d web-server"
